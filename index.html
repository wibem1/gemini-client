<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KI Workspace</title>
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KI Workspace">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --sidebar: #f1f5f9;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1a73e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    /* Dynamische Höhe für Mobilgeräte (verhindert das Verschwinden unter der Leiste) */
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      position: relative;
    }

    /* SIDEBAR */
    #sidebar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 50;
      box-shadow: 2px 0 10px rgba(0,0,0,0.15);
    }
    #sidebar.open { transform: translateX(0); }
    .side-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 40;
    }
    .side-backdrop.open { display: block; }

    .btn-side {
      background: #fff;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .btn-side:active { background: #e2e8f0; }

    /* WORKSPACE */
    #workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      background: #fff;
      overflow: hidden;
    }

    header {
      height: 56px;
      min-height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #fff;
      gap: 6px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
    }
    .brand { font-size: 1.15rem; font-weight: 600; color: #1e293b; margin-right: 2px; }

    .touch-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      flex-shrink: 0;
    }
    .touch-btn:active { background: #cbd5e1; }

    select.ctrl-select {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 14px;
      font-size: 12px;
      outline: none;
      max-width: 130px;
      flex-shrink: 0;
    }

    /* CHAT BEREICH */
    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-overflow-scrolling: touch;
    }
    .chat-box { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 16px; }

    .msg-row { display: flex; width: 100%; gap: 10px; }
    .msg-user { justify-content: flex-end; }
    .bubble-user {
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 18px 4px 18px 18px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-bot {
      flex: 1;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* EINGABEFELD (FEST AM BODEN VERANKERT) */
    footer.input-bar {
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      padding: 10px 12px env(safe-area-inset-bottom, 10px) 12px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .input-box {
      width: 100%;
      max-width: 760px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-box:focus-within { background: #fff; border-color: var(--primary); }
    .input-row { display: flex; align-items: center; gap: 8px; }
    textarea#user-text {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      resize: none;
      height: 32px;
      max-height: 120px;
      padding: 6px 0;
      color: var(--text);
    }
    .btn-send {
      background: var(--primary);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-send:disabled { background: #94a3b8; }

    /* MODAL */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-card input, .modal-card textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      background: #f8fafc;
    }

    #workspace { min-width:0; }
    .brand small { font-size:12px; color:var(--muted); }
    header { height:auto; min-height:70px; padding:12px; align-items:flex-start; }
    .header-left { overflow:visible; flex-wrap:wrap; white-space:normal; min-width:0; gap:8px; }
    select.ctrl-select { border-radius:8px; font-size:16px; max-width:320px; min-height:40px; min-width:0; }
    #sel-model { flex:1; }
    .touch-btn, .btn-send { font-size:14px; min-height:40px; }
    .bubble-user, .bubble-bot, textarea#user-text { font-size:16px; }
    textarea#user-text { min-height:44px; }
    #status { padding:8px 16px; font-size:14px; background:#f1f5f9; color:#334155; overflow-wrap:anywhere; }
    #status.error { color:#9f1239; background:#fff1f2; }
    #status:empty { display:none; }
    .modal-card { max-height:90dvh; overflow:auto; }
    .modal-card input, .modal-card textarea { font-size:16px; }
    .hint { font-size:14px; color:var(--muted); line-height:1.5; margin:8px 0; }
    .chat-item { width:100%; margin-bottom:8px; overflow-wrap:anywhere; }
    .chat-item.active { border-color:var(--primary); color:var(--primary); }
    .msg-meta { font-size:13px; color:var(--muted); margin-bottom:6px; }
    .bubble-bot.error { color:#9f1239; }
    .bubble-bot img, .bubble-user img { max-width:100%; max-height:260px; display:block; margin-top:8px; }
    #key-result { font-size:14px; white-space:pre-wrap; }
    button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline:3px solid #60a5fa; outline-offset:2px; }
    [hidden] { display:none !important; }
    @media (max-width:650px) {
      .brand { flex:1; font-size:16px; }
      #sel-provider { flex-basis:28%; max-width:35%; }
      #sel-model { flex-basis:48%; max-width:calc(65% - 55px); }
      #chat-scroll { padding:14px; }
      .input-box { padding:6px; border-radius:12px; }
      .input-row { flex-wrap:wrap; gap:6px; }
      textarea#user-text { min-width:50%; }
      header { padding-top:max(10px, env(safe-area-inset-top)); }
    }
  </style>
</head>
<body>

  <!-- BACKDROP -->
  <div id="side-backdrop" class="side-backdrop" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <strong>Menü</strong>
      <button class="touch-btn" onclick="closeSidebar()">✕</button>
    </div>
    <button class="btn-side" onclick="newChat()">+ Neuer Chat</button>
    <div id="chat-list" style="flex:1;overflow:auto" aria-label="Gespeicherte Chats"></div>
<button id="install-button" class="btn-side" onclick="installApp()">App installieren</button>
    <button class="btn-side" onclick="exportMarkdown()">Markdown-Export</button>
    <button class="btn-side" onclick="exportJson()">JSON-Backup</button>
    <button class="btn-side" style="color:#dc2626;" onclick="clearHistory()">Verlauf leeren</button>
  </aside>

  <!-- HAUPTBEREICH -->
  <div id="workspace">
    <header>
      <div class="header-left">
        <button class="touch-btn" aria-label="Menü öffnen" onclick="openSidebar()">☰</button>
        <span class="brand">KI Workspace <small>1.0.1</small></span>

        <!-- Dropdowns -->
        <select aria-label="Anbieter" id="sel-provider" class="ctrl-select" onchange="filterModels(true)"></select>
        <select aria-label="Modell" id="sel-model" class="ctrl-select" onchange="saveModelChoice()"></select>

        <button class="touch-btn" onclick="fetchLiveModels()" title="Modellliste aktualisieren" aria-label="Modellliste aktualisieren">↻</button>
      </div>

      <button class="touch-btn" aria-label="Einstellungen" onclick="openModal()">⚙</button>
    </header>

<div id="status" role="status" aria-live="polite"></div>
    <!-- CHAT VERLAUF -->
    <main id="chat-scroll">
      <div class="chat-box" id="chat-container">
        <div id="hero" style="margin-top: 10vh; text-align: left;">
          <h2 style="font-size: 2rem; font-weight: 600; background: linear-gradient(90deg, #1a73e8, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Hallo, Wilhelm</h2>
          <p style="font-size: 1.5rem; color: #94a3b8; font-weight: 500;">Womit kann ich heute helfen?</p>
        </div>
      </div>
    </main>

    <!-- EINGABE (PERMANENT AM UNTEREN RAND) -->
    <footer class="input-bar">
      <div class="input-box">
        <div id="file-indicator" style="display:none; font-size:11px; color:var(--primary);">
          <span id="file-name"></span>
          <strong onclick="removeFile()" style="cursor:pointer; color:red; margin-left:8px;">✕</strong>
        </div>
        <div class="input-row">
          <input type="file" id="file-picker" style="display:none;" onchange="onFilePicked(event)">
          <button class="touch-btn" aria-label="Bild oder Textdatei anhängen" onclick="document.getElementById('file-picker').click()">📎</button>
          <textarea aria-label="Nachricht" id="user-text" placeholder="Nachricht eingeben..." rows="1" oninput="autoResize(this)"></textarea>
          <button id="btn-stop" class="touch-btn" onclick="stopRequest()" hidden>Stop</button>
          <button id="btn-retry" class="touch-btn" onclick="retryMessage()" hidden>Erneut versuchen</button>
          <button id="btn-send" class="btn-send" onclick="sendMessage()">Senden</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- EINSTELLUNGEN MODAL -->
  <div id="settings-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h3 id="settings-title">Einstellungen</h3>
      <div>
        <label for="input-key" style="font-size:14px; color:var(--muted); display:block; margin-bottom:4px;">OpenRouter API-Schlüssel</label>
        <input type="password" id="input-key" placeholder="sk-or-v1-..." autocomplete="off">
<p class="hint">Der Schlüssel wird auf diesem Gerät gespeichert und nur direkt an OpenRouter gesendet.</p>
<button class="touch-btn" onclick="testConnection()">Verbindung prüfen</button>
<p id="key-result" role="status"></p>
      </div>
      <div>
        <label for="input-mem" style="font-size:14px; color:var(--muted); display:block; margin-bottom:4px;">Zusätzliche Angaben an die KI</label>
        <textarea id="input-mem" rows="4" placeholder="Instruktionen für die KI..."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="touch-btn" onclick="cancelModal()">Schließen</button>
        <button class="touch-btn" style="background:var(--primary); color:#fff; border:none;" onclick="closeModal()">Speichern</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
